    right_ip: "10.0.0.2"
    left_subnet: "10.0.0.0/24"
    right_subnet: "10.0.0.0/24"
    auth_method: psk
    traffic_types: [icmp, tcp, iperf]
    capture_duration: 60
    tags: [aes256, aes-gcm, aead, no-pfs, ipv4, tunnel]

  # ---------------------------------------------------------------------------
