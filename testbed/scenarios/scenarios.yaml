    ike_version: 2
    encryption: aes128cbc
    integrity: sha256
    prf: sha256
    dh_group: modp2048
    pfs: true
    ip_version: 6
    left_ip: "fd00::1"
    right_ip: "fd00::2"
    left_subnet: "fd00::/64"
    right_subnet: "fd00::/64"
    auth_method: psk
    traffic_types: [icmp, tcp, udp]
    capture_duration: 60
