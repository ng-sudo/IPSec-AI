  - id: scen_12_transport_aes128gcm_dh14_pfs_ipv4
    name: "Transport / AES-128-GCM-16 / DH14 / PFS / IPv4"
    description: >
      IKEv2 transport mode with AES-128-GCM-16 AEAD, MODP-2048, PFS enabled,
