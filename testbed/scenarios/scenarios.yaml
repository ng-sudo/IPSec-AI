  - id: scen_18_tunnel_aes128cbc_sha256_dh14_pfs_ipv4_ikev1
    name: "Tunnel / AES-128-CBC / SHA-256 / DH14 / PFS / IPv4 / IKEv1"
    description: >
      Legacy IKEv1 tunnel mode with AES-128-CBC, SHA-256, MODP-2048, PFS enabled,
      over IPv4. Generates IKEv1 Main Mode + Quick Mode exchange traffic for
      ML training diversity. Uses legacy ipsec.conf (not swanctl).
