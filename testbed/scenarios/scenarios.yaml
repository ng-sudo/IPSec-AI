# =============================================================================
# PS 26160 — IPSecAI  |  Master Scenario Definitions
# =============================================================================
# This file is the single source of truth for all testbed scenarios.
# render_configs.py reads this file, validates it against schema.yaml, and
# renders per-scenario strongSwan configuration files into configs/generated/.
#
# Dimensions covered (PS-required):
#   mode          : tunnel | transport
#   encryption    : aes128cbc | aes256cbc | aes128gcm16 | aes256gcm16
#   integrity     : sha256 | sha384 | sha512 | (none — implicit in AEAD)
#   dh_group      : modp2048 (DH14) | ecp256 (DH19) | ecp384 (DH20)
#   pfs           : true | false
#   ip_version    : 4 | 6
#   ike_version   : 2  (IKEv1 legacy scenarios use ike_version: 1)
#   traffic_types : [icmp, tcp, udp, iperf]
# =============================================================================

scenarios:

  # ---------------------------------------------------------------------------
  # Group 1: Tunnel mode — AES-CBC + HMAC — IPv4
  # ---------------------------------------------------------------------------

  - id: scen_01_tunnel_aes128cbc_sha256_dh14_pfs_ipv4
    name: "Tunnel / AES-128-CBC / SHA-256 / DH14 / PFS / IPv4"
    description: >
      Baseline IKEv2 tunnel mode with AES-128-CBC encryption, SHA-256 integrity,
      MODP-2048 (DH group 14) key exchange, PFS enabled, over IPv4.
    mode: tunnel
    ike_version: 2
    encryption: aes128cbc
    integrity: sha256
    prf: sha256
    dh_group: modp2048
    pfs: true
    ip_version: 4
    left_ip: "10.0.0.1"
    right_ip: "10.0.0.2"
    left_subnet: "10.0.0.0/24"
    right_subnet: "10.0.0.0/24"
    auth_method: psk
    traffic_types: [icmp, tcp, udp]
    capture_duration: 60
    tags: [baseline, aes-cbc, pfs, ipv4, tunnel]

  - id: scen_02_tunnel_aes256cbc_sha256_dh14_pfs_ipv4
    name: "Tunnel / AES-256-CBC / SHA-256 / DH14 / PFS / IPv4"
    description: >
      IKEv2 tunnel mode with AES-256-CBC encryption, SHA-256 integrity,
      MODP-2048 (DH group 14) key exchange, PFS enabled, over IPv4.
    mode: tunnel
    ike_version: 2
    encryption: aes256cbc
    integrity: sha256
    prf: sha256
    dh_group: modp2048
    pfs: true
    ip_version: 4
    left_ip: "10.0.0.1"
    right_ip: "10.0.0.2"
    left_subnet: "10.0.0.0/24"
    right_subnet: "10.0.0.0/24"
    auth_method: psk
    traffic_types: [icmp, tcp, udp]
    capture_duration: 60
    tags: [aes256, aes-cbc, pfs, ipv4, tunnel]

  - id: scen_03_tunnel_aes256cbc_sha384_dh19_pfs_ipv4
    name: "Tunnel / AES-256-CBC / SHA-384 / DH19 / PFS / IPv4"
    description: >
      IKEv2 tunnel mode with AES-256-CBC encryption, SHA-384 integrity,
      ECP-256 (DH group 19) key exchange, PFS enabled, over IPv4.
    mode: tunnel
    ike_version: 2
    encryption: aes256cbc
    integrity: sha384
    prf: sha384
    dh_group: ecp256
    pfs: true
    ip_version: 4
    left_ip: "10.0.0.1"
    right_ip: "10.0.0.2"
    left_subnet: "10.0.0.0/24"
    right_subnet: "10.0.0.0/24"
    auth_method: psk
    traffic_types: [icmp, tcp, iperf]
    capture_duration: 90
    tags: [aes256, aes-cbc, ecp256, dh19, pfs, ipv4, tunnel]

  - id: scen_04_tunnel_aes256cbc_sha512_dh20_pfs_ipv4
    name: "Tunnel / AES-256-CBC / SHA-512 / DH20 / PFS / IPv4"
    description: >
      IKEv2 tunnel mode with AES-256-CBC encryption, SHA-512 integrity,
      ECP-384 (DH group 20) key exchange, PFS enabled, over IPv4.
    mode: tunnel
    ike_version: 2
    encryption: aes256cbc
    integrity: sha512
    prf: sha512
    dh_group: ecp384
    pfs: true
    ip_version: 4
    left_ip: "10.0.0.1"
    right_ip: "10.0.0.2"
    left_subnet: "10.0.0.0/24"
    right_subnet: "10.0.0.0/24"
    auth_method: psk
    traffic_types: [icmp, tcp, iperf]
    capture_duration: 90
    tags: [aes256, aes-cbc, ecp384, dh20, pfs, ipv4, tunnel]

  # ---------------------------------------------------------------------------
  # Group 2: Tunnel mode — AES-GCM (AEAD) — IPv4
  # ---------------------------------------------------------------------------

  - id: scen_05_tunnel_aes128gcm_dh14_pfs_ipv4
    name: "Tunnel / AES-128-GCM-16 / DH14 / PFS / IPv4"
    description: >
      IKEv2 tunnel mode with AES-128-GCM-16 AEAD encryption (no separate
      integrity algorithm), MODP-2048 (DH group 14) key exchange, PFS enabled,
      over IPv4.
    mode: tunnel
    ike_version: 2
    encryption: aes128gcm16
    integrity: null          # AEAD — integrity is implicit
    prf: sha256
    dh_group: modp2048
    pfs: true
    ip_version: 4
    left_ip: "10.0.0.1"
    right_ip: "10.0.0.2"
    left_subnet: "10.0.0.0/24"
    right_subnet: "10.0.0.0/24"
    auth_method: psk
    traffic_types: [icmp, tcp, udp, iperf]
    capture_duration: 90
    tags: [aes-gcm, aead, pfs, ipv4, tunnel]

  - id: scen_06_tunnel_aes256gcm_dh19_pfs_ipv4
