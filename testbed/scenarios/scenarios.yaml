  - id: scen_07_tunnel_aes256gcm_dh20_pfs_ipv4
    name: "Tunnel / AES-256-GCM-16 / DH20 / PFS / IPv4"
    description: >
      IKEv2 tunnel mode with AES-256-GCM-16 AEAD encryption,
      ECP-384 (DH group 20) key exchange, PFS enabled, over IPv4.
    mode: tunnel
    ike_version: 2
    encryption: aes256gcm16
    integrity: null
    prf: sha384
    dh_group: ecp384
    pfs: true
    ip_version: 4
    left_ip: "10.0.0.1"
    right_ip: "10.0.0.2"
    left_subnet: "10.0.0.0/24"
    right_subnet: "10.0.0.0/24"
    auth_method: psk
    traffic_types: [icmp, tcp, udp, iperf]
    capture_duration: 90
    tags: [aes256, aes-gcm, aead, ecp384, dh20, pfs, ipv4, tunnel]

