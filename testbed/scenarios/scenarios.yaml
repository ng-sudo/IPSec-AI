  - id: scen_08_tunnel_aes128cbc_sha256_dh14_nopfs_ipv4
    name: "Tunnel / AES-128-CBC / SHA-256 / DH14 / No-PFS / IPv4"
    description: >
      IKEv2 tunnel mode with AES-128-CBC, SHA-256, MODP-2048, PFS DISABLED.
      Demonstrates the security difference vs. PFS-enabled scenarios.
    mode: tunnel
    ike_version: 2
    encryption: aes128cbc
    integrity: sha256
    prf: sha256
    dh_group: modp2048
    pfs: false
    ip_version: 4
    left_ip: "10.0.0.1"
