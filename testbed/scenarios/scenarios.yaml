  # ---------------------------------------------------------------------------

  - id: scen_10_transport_aes128cbc_sha256_dh14_pfs_ipv4
    name: "Transport / AES-128-CBC / SHA-256 / DH14 / PFS / IPv4"
    description: >
      IKEv2 transport mode with AES-128-CBC, SHA-256, MODP-2048, PFS enabled,
      over IPv4. Transport mode protects only the payload (no outer IP header).
    mode: transport
    ike_version: 2
    encryption: aes128cbc
    integrity: sha256
    prf: sha256
    dh_group: modp2048
    pfs: true
    ip_version: 4
    left_ip: "10.0.0.1"
    right_ip: "10.0.0.2"
    left_subnet: null        # transport mode — no subnet encapsulation
    right_subnet: null
    auth_method: psk
    traffic_types: [icmp, tcp, udp]
    capture_duration: 60
    tags: [aes128, aes-cbc, pfs, ipv4, transport]

  - id: scen_11_transport_aes256cbc_sha256_dh19_pfs_ipv4
    name: "Transport / AES-256-CBC / SHA-256 / DH19 / PFS / IPv4"
